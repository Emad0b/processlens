[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "processlens"
version = "0.1.0"
description = "Event-log process discovery, conformance diagnostics and elapsed-time analysis."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
processlens = "processlens.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
processlens = ["source.json"]
